name: Set up verification
description: Shared JDK, Gradle and Robolectric setup for layered verification
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
      with:
        distribution: temurin
        java-version: '21'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Cache Robolectric runtime
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
        restore-keys: |
          robolectric-${{ runner.os }}-
    - name: Prepare Gradle wrapper
      shell: bash
      run: |
        chmod +x ./gradlew
        git config core.fileMode false
