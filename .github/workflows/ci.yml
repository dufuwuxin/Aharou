name: CI

# push / PR: foundation modules -> app domain regressions -> combined gates -> final APK.
# 目的是合入前的兜底门禁，避免编译错误/回归推迟到打 tag 发版当天才暴露。
# 打 v* tag 的发版构建走 android-release.yml，不在这里。
on:
  workflow_dispatch:
  push:
    branches: [ master, main, feat/operit2-major-upgrade ]
    # 纯文档/资源改动不影响构建产物，跳过 CI 省时间（public 仓库虽不扣额度，但省 11 分钟等待）。
    # 注意：只要本次 push 含任一非忽略路径的改动，CI 仍会触发。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'data/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'data/**'
      - 'LICENSE'
      - '.gitignore'

# 同分支新提交到来时取消正在跑的旧 run，省 CI 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AHAROU_CI_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: core-agent
            task: ':core-agent:test'
            report: core-agent/build/test-results/test
          - module: core-storage
            task: ':core-storage:jvmJar'
            report: ''
          - module: terminal-emulator
            task: ':terminal-emulator:compileDebugJavaWithJavac'
            report: ''
          # terminal-view applies only com.android.library, not the Kotlin plugin.
          - module: terminal-view
            task: ':terminal-view:compileDebugJavaWithJavac'
            report: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verification
        uses: ./.github/actions/setup-verification
      - name: Verify real foundation module
        run: ./gradlew ${{ matrix.task }} --stacktrace --console=plain
      - name: Upload foundation results
        if: always() && matrix.report != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: foundation-${{ matrix.module }}
          path: ${{ matrix.report }}/**
          retention-days: 7
          if-no-files-found: error

  feature-tests:
    name: App feature regressions
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AHAROU_CI_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verification
        uses: ./.github/actions/setup-verification
      - name: Check CI layering contract
        run: python3 scripts/test_ci_layers.py
      # All domains use :app:testArmsoloDebugUnitTest, NOT independently compiled features.
      # Gradle reuses the app compilation between steps; each domain archives its own XML.
      - name: Test agent domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group agent 2>&1 | tee -a /tmp/unit.log
      - name: Test backup domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group backup 2>&1 | tee -a /tmp/unit.log
      - name: Test browser domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group browser 2>&1 | tee -a /tmp/unit.log
      - name: Test credentials domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group credentials 2>&1 | tee -a /tmp/unit.log
      - name: Test editor domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group editor 2>&1 | tee -a /tmp/unit.log
      - name: Test git domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group git 2>&1 | tee -a /tmp/unit.log
      - name: Test localmodel domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group localmodel 2>&1 | tee -a /tmp/unit.log
      - name: Test onboarding domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group onboarding 2>&1 | tee -a /tmp/unit.log
      - name: Test pet domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group pet 2>&1 | tee -a /tmp/unit.log
      - name: Test plugin domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group plugin 2>&1 | tee -a /tmp/unit.log
      - name: Test sandbox domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group sandbox 2>&1 | tee -a /tmp/unit.log
      - name: Test settings domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group settings 2>&1 | tee -a /tmp/unit.log
      - name: Test terminal domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group terminal 2>&1 | tee -a /tmp/unit.log
      - name: Test vault domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group vault 2>&1 | tee -a /tmp/unit.log
      - name: Test workspace domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group workspace 2>&1 | tee -a /tmp/unit.log
      - name: Test core domain
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 scripts/ci_test_groups.py --group core 2>&1 | tee -a /tmp/unit.log
      - name: Verify complete disjoint app regression
        id: group_manifest
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_test_groups.py --verify-all
      - name: Collect core-agent results
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: foundation-core-agent
          path: core-agent/build/test-results/test
      - name: Run combined same-JVM app regression
        id: combined_regression
        run: |
          set -o pipefail
          ./gradlew :app:testArmsoloDebugUnitTest :core-agent:test --console=plain 2>&1 | tee -a /tmp/unit.log
          python3 scripts/ci_test_groups.py --verify-combined
      - name: Export exact combination JVM dependencies
        if: always() && steps.group_manifest.outcome == 'success' && steps.combined_regression.outcome == 'success'
        run: |
          python3 - <<'PYDEPS'
          from pathlib import Path
          import hashlib, json, shutil
          cache = Path.home() / ".gradle/caches/modules-2/files-2.1"
          output = Path("combination-dependencies")
          required = ["org.jetbrains.kotlin/kotlin-compiler-embeddable/2.3.21", "org.jetbrains.kotlin/kotlin-stdlib/2.3.21", "org.jetbrains.kotlin/kotlin-script-runtime/2.3.21", "org.jetbrains.kotlin/kotlin-reflect/1.6.10", "org.jetbrains.kotlin/kotlin-daemon-embeddable/2.3.21", "org.jetbrains/annotations/13.0", "org.jetbrains.kotlinx/kotlinx-coroutines-core-jvm/1.10.2", "org.yaml/snakeyaml/2.2", "com.android.tools/r8/9.1.57"]
          manifest = {}
          for dependency in required:
              jars = list((cache / dependency).glob("*/*.jar"))
              if not jars:
                  raise SystemExit("Missing resolved JVM dependency: " + dependency)
              for source in jars:
                  relative = source.relative_to(cache)
                  target = output / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  manifest[str(relative)] = hashlib.sha256(source.read_bytes()).hexdigest()
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2))
          PYDEPS
      - name: Upload combination dependencies
        if: always() && steps.group_manifest.outcome == 'success' && steps.combined_regression.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: combination-jvm-dependencies
          path: combination-dependencies/**
          retention-days: 7
          if-no-files-found: error
      - name: Upload disjoint feature reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: feature-group-results
          path: app/build/test-results/ciGroups/**
          retention-days: 7
          if-no-files-found: error
      - name: Upload test report
        if: always() && steps.group_manifest.outcome == 'success' && steps.combined_regression.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-results
          path: |
            app/build/test-results/testArmsoloDebugUnitTest/**
            core-agent/build/test-results/test/**
          retention-days: 7
          if-no-files-found: error
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-test-log
          path: /tmp/unit.log
          retention-days: 7
          if-no-files-found: warn

  combination:
    name: Combined quality gates
    needs: feature-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AHAROU_CI_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verification
        uses: ./.github/actions/setup-verification
      - name: Download complete regression reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: feature-group-results
          path: app/build/test-results/ciGroups
      - name: Download exact combination dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: combination-jvm-dependencies
          path: combination-dependencies
      - name: Verify and restore combination dependency identity
        run: |
          python3 - <<'PYDEPS'
          from pathlib import Path
          import hashlib, json, shutil
          root = Path("combination-dependencies")
          manifest = json.loads((root / "manifest.json").read_text())
          if not manifest:
              raise SystemExit("Empty combination dependency manifest")
          cache = Path.home() / ".gradle/caches/modules-2/files-2.1"
          for name, expected in manifest.items():
              relative = Path(name)
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit("Invalid dependency path")
              source = root / relative
              if hashlib.sha256(source.read_bytes()).hexdigest() != expected:
                  raise SystemExit("Combination dependency digest mismatch: " + name)
              target = cache / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PYDEPS
      - name: Reconcile complete app regression
        run: python3 scripts/ci_test_groups.py --verify-all
      # 迁移版本号对账：编号连续、SCHEMA_VERSION 一致、已发布迁移未被篡改/复用
      # （hotfix 合流后 master 未把未发布迁移后移会在这里被拦）。
      - name: Check migration versions
        run: |
          python3 scripts/check_migrations.py
          python3 scripts/test_check_migrations.py

      # 官方技能自检：frontmatter 与命名、description 长度、验收用例是否齐全、
      # 市场配置两处是否一致、展示名有没有同步进文档。
      - name: Check official skills
        run: python3 scripts/check_skills.py

      # 架构门禁：禁用组件 import、文件行数棘轮、双语 strings 一致性。
      - name: Check native ARM64 Ubuntu builtin asset
        run: |
          python3 scripts/check_builtin_container.py
          python3 scripts/test_builtin_ubuntu.py
          python3 -m unittest discover -s scripts -p test_container_image_sync.py

      - name: Check architecture rules
        run: |
          python3 scripts/check_architecture.py
          python3 scripts/test_native_memory_contract.py
          python3 -m unittest discover -s scripts -p test_arm64_assets.py
          python3 scripts/test_void_toolchain.py
          python3 scripts/test_build_logging.py
          python3 scripts/test_code_structure.py
          python3 scripts/test_settings_navigation.py
          python3 scripts/test_no_im_bots.py
          python3 scripts/test_project_compact_layout.py
          python3 scripts/test_project_chat_composer.py
          python3 scripts/test_background_shell.py
          python3 scripts/test_builtin_system.py
          python3 scripts/check_builtin_seed_history.py
          python3 scripts/test_builtin_seed_history.py
          python3 scripts/test_security_audit.py

      # 基线只许缩：--sync-baseline 一条命令就能把棘轮抬起来，不做 diff 比对时 CI 会照常通过。
      # 只对「数值上涨 / 新增登记」报错，收紧与删除放行。
      - name: Verify architecture baseline only shrinks
        run: python3 scripts/check_architecture.py --check-ratchet

      - name: Verify built-in team evidence fixtures
        run: python3 scripts/test_builtin_team_evidence.py

      - name: Verify minified YAML package reflection
        run: python3 scripts/test_release_yaml.py


  build:
    name: Build & Test
    needs: combination
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AHAROU_CI_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verification
        uses: ./.github/actions/setup-verification
      # 单 flavor 冒烟：只构 armsolo debug（CLAUDE.md 规范：AI 改完编译型代码默认跑这个），
      # 不构全量三 flavor，省三倍 Kotlin 编译。编译闸门在 CI 由 AHAROU_CI_BUILD=1 放行，
      # 不再写本地 build-allowed 令牌（闸门双条件：用户弹窗确认或 CI 环境变量）。
      - name: Build armsolo debug (smoke)
        run: ./gradlew :app:assembleArmsoloDebug --stacktrace

      - name: Verify host plugin SDK and real DEX compilation
        run: |
          python3 scripts/test_plugin_sdk.py
          python3 scripts/test_plugin_preflight.py
          python3 scripts/test_build_intent.py
          python3 scripts/test_translation_app_download.py
          python3 scripts/test_translation_quality.py --bridge-test
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import tempfile
          import zipfile

          sdk = Path(os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"])
          tools = [p for p in (sdk / "build-tools").glob("*/d8") if all(v.isdigit() for v in p.parent.name.split("."))]
          platforms = [p for p in (sdk / "platforms").glob("android-*/android.jar") if p.parent.name.removeprefix("android-").isdigit()]
          if not tools or not platforms:
              raise SystemExit("Android SDK has no installed D8 or android.jar")
          d8 = max(tools, key=lambda p: tuple(int(v) for v in p.parent.name.split(".")))
          android = max(platforms, key=lambda p: int(p.parent.name.removeprefix("android-")))
          javac = Path(os.environ["JAVA_HOME"]) / "bin" / "javac"
          cli = "app/src/main/assets/plugin-sdk/build_plugin.py"
          examples = Path("app/src/main/assets/plugin-sdk/examples")
          with tempfile.TemporaryDirectory(prefix="host-plugin-sdk-") as folder:
              output = Path(folder) / "java.txplugin"
              subprocess.run(["python3", cli, "--source-dir", str(examples / "java"), "--manifest", str(examples / "java/manifest.json"), "--sdk-src", "app/src/main/java", "--javac", str(javac), "--d8", str(d8), "--android-jar", str(android), "--output", str(output)], check=True)
              with zipfile.ZipFile(output) as package:
                  assert package.read("payload/classes.dex").startswith(b"dex\n")
              subprocess.run(["python3", cli, "--source-dir", str(examples / "js"), "--manifest", str(examples / "js/manifest.json"), "--output", str(Path(folder) / "js.txplugin")], check=True)
          PY

      - name: Upload plugin patrol evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-patrol-evidence
          path: |
            app/build/reports/pluginPatrol/**
            app/build/test-results/pluginPatrolTest/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload verified APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-debug-apk
          path: app/build/outputs/apk/armsolo/debug/*.apk
          retention-days: 7
          if-no-files-found: error
