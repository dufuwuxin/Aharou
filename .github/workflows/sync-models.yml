name: Sync Models Metadata

on:
  schedule:
    # 每天 UTC 04:00 自动执行一次（对应北京时间 12:00）
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 界面手动触发

permissions:
  contents: write

# 同一时刻只允许一次同步，模型快照与代码共用 main。
concurrency:
  group: sync-models
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fetch full models.dev metadata to data/models.json
        run: |
          python3 scripts/sync-models-dev.py

      - name: Publish model snapshot to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/models.json
          if git diff --cached --quiet; then
            echo "模型元数据无变动，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 同步 models.dev 完整元数据"
          git push origin HEAD:main
